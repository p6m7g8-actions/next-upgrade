name: "P6 GHA: Upgrade Dependencies for NextJS Static Site"
description: "P6 GHA: Upgrade Dependencies for NextJS Static Site"
author: "Philip M. Gollucci"
inputs:
  gh_token:
    description: "Automation token used to trigger auto-approve events (P6_A_GH_TOKEN)"
    required: true
  git_token:
    description: "Optional extra fallback token for branch operations"
    required: false
    default: ""
  hold_dependencies:
    description: >-
      Packages whose package.json range must survive the upgrade, separated by
      spaces, newlines, or both. See the Update Dependencies step for why
      typescript is held.
    required: false
    default: "typescript"
runs:
  using: "composite"
  steps:
    - name: Checkout code
      uses: p6m7g8-actions/gh-repo-checkout@main
      with:
        fetch-depth: 0
    - name: Force main branch
      shell: bash
      run: |
        git fetch origin main
        git checkout -B main origin/main
    - name: Node
      uses: p6m7g8-actions/p6-node-setup@main
    - name: Update Dependencies
      shell: bash
      env:
        HOLD: ${{ inputs.hold_dependencies }}
      run: |
        set -euo pipefail

        # `pnpm up --latest` ignores package.json ranges by design, and pnpm has
        # no dependency-name exclusion: the `!` negation in `pnpm up --help` is
        # `--filter` only, which selects workspace packages, not dependencies.
        # So snapshot the declared ranges, upgrade, then put the held ones back
        # and let pnpm re-resolve the lockfile.
        #
        # `typescript` is held by default because the 2026-08-02 run bumped it
        # 5.9.3 to 7.0.2 and broke `build` fleet-wide two ways:
        # `@typescript-eslint` 8.65.0 exits 2 with "typescript-eslint does not
        # support TS 7.0", and ts-node throws on `fileExists`. Verified on
        # p6-domains that holding typescript alone, with every other upgrade
        # applied, makes `pnpm run build` pass. Drop this default once the
        # eslint toolchain supports TS 7.
        before="$(mktemp)"
        cp package.json "$before"

        pnpm up --latest --prod

        if [ -n "${HOLD//[[:space:]]/}" ]; then
          # `read` consumes ONE line, so a `hold_dependencies: |` block -- the
          # dominant Actions idiom, one package per line -- would silently hold
          # only the first entry and upgrade the rest. Flatten newlines to
          # spaces first so both spellings behave the same. The emptiness guard
          # above already covers newline-only input.
          read -ra hold <<< "${HOLD//$'\n'/ }"
          held=0
          for pkg in "${hold[@]}"; do
            # `--prod` above scopes the upgrade to `dependencies` AND
            # `optionalDependencies`, so omitting the latter here reported
            # "nothing to hold" while the package was in fact being upgraded.
            range="$(jq -r --arg p "$pkg" \
              '.dependencies[$p] // .devDependencies[$p]
               // .optionalDependencies[$p] // empty' "$before")"
            if [ -z "$range" ]; then
              echo "::notice::${pkg} not declared; nothing to hold"
              continue
            fi
            patched="$(mktemp)"
            # Each branch names the section the range was found in. A bare
            # `else .devDependencies[$p] = $r` would CREATE a devDependencies
            # entry for an optionalDependencies-only package, moving it between
            # sections behind your back.
            jq --arg p "$pkg" --arg r "$range" \
              'if .dependencies[$p] then .dependencies[$p] = $r
               elif .devDependencies[$p] then .devDependencies[$p] = $r
               else .optionalDependencies[$p] = $r end' \
              package.json > "$patched"
            mv "$patched" package.json
            held=$((held + 1))
            echo "::notice::held ${pkg} at ${range}"
          done
          # Only re-resolve when a range actually changed. If every requested
          # package was undeclared, the lockfile pnpm just wrote is correct.
          if [ "$held" -gt 0 ]; then
            pnpm install --no-frozen-lockfile
          fi
        fi
    - name: Generate Delta
      shell: bash
      run: |
        git diff
    - name: Normalize GitHub token
      id: token
      uses: p6m7g8-actions/gh-token-resolve@main
      with:
        preferred-token: ${{ github.token }}
        fallback-token: ${{ inputs.gh_token }}
        default-token: ${{ github.token }}
    - name: Configure authenticated git remote
      shell: bash
      run: |
        git remote set-url origin "https://x-access-token:${{ steps.token.outputs.value }}@github.com/${{ github.repository }}.git"
    - name: Create Pull Request
      id: create_pr
      uses: peter-evans/create-pull-request@v8.1.0
      with:
        token: ${{ steps.token.outputs.value }}
        branch-token: ${{ steps.token.outputs.value }}
        commit-message: |
          chore(deps): upgrade dependencies
        base: main
        branch: github-actions/upgrade-main
        title: "chore(deps): upgrade dependencies"
        labels: |
          auto-approve
          auto-merge
        reviewers: |
          p6m7g8-automation
        body: |
          Upgrades project dependencies.
        # Every target enforces `required_signatures`, and a commit made by
        # `git commit` on a runner has no key. Unsigned upgrade PRs were rejected
        # by the merge queue with "Commits must have verified signatures" and sat
        # open for months; the batch from 2026-03-03 never had a chance.
        #
        # `sign-commits` makes the action create the commit through the GitHub
        # API, which signs it. It only works with GITHUB_TOKEN or a GitHub App
        # token -- with a PAT the PR is still created but the commits are
        # silently NOT signed. That is why the token above resolves to
        # `github.token`, and why `author`/`committer` are gone: upstream ignores
        # both when signing.
        sign-commits: true
        signoff: true
    - name: Re-label PR with automation token
      if: steps.create_pr.outputs.pull-request-number != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh_token || github.token }}
      run: |
        pr="${{ steps.create_pr.outputs.pull-request-number }}"
        repo="${{ github.repository }}"
        gh api -X DELETE "repos/${repo}/issues/${pr}/labels/auto-approve" || true
        gh api "repos/${repo}/issues/${pr}/labels" -f labels[]='auto-approve'

    # Signing forces GITHUB_TOKEN, and GitHub deliberately does not dispatch
    # workflows for events raised by it. So a signed upgrade PR gets NO
    # `build`, `Lint PR title`, or `claude-review` -- all three are required, so
    # it is blocked on missing checks instead of on signatures. Verified on
    # p6m7g8/p6-domain-records: bot PR #185 had only `Summary`, while #184 from
    # a user token one day earlier had the full suite.
    #
    # Closing and reopening with the automation PAT raises a `reopened` event
    # from a non-GITHUB_TOKEN identity, which does dispatch. Every build template
    # accepts `reopened`, either explicitly or via the `pull_request` defaults.
    #
    # The proper fix is a GitHub App token, which both signs and dispatches.
    # This is the workaround until one exists.
    - name: Fire required checks the signed PR cannot trigger itself
      if: steps.create_pr.outputs.pull-request-number != '' && inputs.gh_token != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh_token }}
      run: |
        set -euo pipefail
        pr="${{ steps.create_pr.outputs.pull-request-number }}"
        repo="${{ github.repository }}"
        echo "::notice::$repo#$pr: reopening with the automation token so required checks dispatch"
        gh pr close "$pr" --repo "$repo"
        gh pr reopen "$pr" --repo "$repo"
